  <style>
    #filters {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(150px, .7fr) minmax(220px, 1fr);

      background: rgba(255, 255, 255, .1);
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 15px;
      outline: none;
    }

    #filters select {
      appearance: none;
      -webkit-appearance: none;
      padding-left: 16px;
      padding-right: 44px;
      background-image:
        linear-gradient(45deg, transparent 50%, rgba(255, 255, 255, .75) 50%),
        linear-gradient(135deg, rgba(255, 255, 255, .75) 50%, transparent 50%);
      background-position:
        calc(100% - 20px) 22px,
        calc(100% - 15px) 22px;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }

    #filters select option { color: #05000f; }
    #filters select:focus, #filters input:focus { border-color: #aa64ff; box-shadow: 0 0 0 3px #aa64ff33; }
    .filter-empty { grid-column: 1 / -1; margin: 0; text-align: center; opacity: .7; }

    @media (max-width: 700px) {
      #filters { grid-template-columns: 1fr; margin-bottom: 24px; }

  <script>
    fetch('tracks.json')
      .then((response) => response.json())
      .then((tracks) => {
        const filters = document.querySelector('#filters');
        const trackList = document.querySelector('#tracks');
        const byTitle = new Map(tracks.map((track) => [track.title, track]));

        filters.innerHTML = `
          <select aria-label="Выберите ученика">
            <option value="">Все ученики</option>
            ${[...new Set(tracks.map((track) => track.student))].sort((a,b)=>a.localeCompare(b, "ru")).map((student) => `<option value="${student}">${student}</option>`).join('')}
          </select>
          <select aria-label="Выберите модуль">
            <option value="">Все модули</option>
            ${[...new Set(tracks.map((track) => track.module))].sort((a,b)=>a.localeCompare(b, "ru")).map((module) => `<option value="${module}">${module}</option>`).join('')}
          </select>
          <input type="search" placeholder="Поиск по названию, ученику или модулю" aria-label="Поиск">
          <p class="filter-empty" hidden>Ничего не найдено</p>
        `;

        const [studentFilter, moduleFilter, searchFilter] = filters.querySelectorAll('select, input');
        const emptyState = filters.querySelector('.filter-empty');
        const filterControls = [studentFilter, moduleFilter, searchFilter];
        const syncFilterState = () => {
          const isListening = document.body.classList.contains('listening');
          filterControls.forEach((control) => { control.disabled = isListening; });
        };
        const applyFilters = () => {
          let visible = 0;
          trackList.querySelectorAll('.track-card').forEach((card) => {
            const track = byTitle.get(card.dataset.track);
            const matches = track
              && (!studentFilter.value || track.student === studentFilter.value)
              && (!moduleFilter.value || track.module === moduleFilter.value)
              && [track.title, track.student, track.module].join(" ").toLocaleLowerCase().includes(searchFilter.value.trim().toLocaleLowerCase());
            card.hidden = !matches;
            if (matches) visible += 1;
          });
          emptyState.hidden = visible !== 0;
        };

        filterControls.forEach((control) => control.addEventListener('input', applyFilters));
        new MutationObserver(syncFilterState).observe(document.body, { attributes: true, attributeFilter: ['class'] });
        new MutationObserver(applyFilters).observe(trackList, { childList: true });
        syncFilterState();
        applyFilters();
      })
      .catch((error) => console.error('Filter loading error:', error));

    let mobileAnalysisToken = 0;
    let mobileTrackAnalysis = null;

    window.getMobileTrackLevels = (time) => {
      if (!mobileTrackAnalysis) return null;

      const { energy, step } = mobileTrackAnalysis;
      const index = Math.min(energy.length - 1, Math.max(0, Math.floor(time / step)));
      const current = energy[index] || 0;
      const previous = energy[Math.max(0, index - 1)] || current;
      const next = energy[Math.min(energy.length - 1, index + 1)] || current;
      const change = Math.abs(next - previous);
      const accent = Math.abs(next - current * 2 + previous);

      return {
        bass: Math.min(1, .12 + current * .82),
        mid: Math.min(1, .08 + current * .3 + change * 2.2),
        high: Math.min(1, .05 + current * .18 + accent * 4)
      };
    };

    window.addEventListener('track-change', async (event) => {
      if ('mediaSession' in navigator && 'MediaMetadata' in window) {
        const artworkPath = event.detail.cover || 'covers/default.jpeg';
        const artworkUrl = new URL(artworkPath, window.location.href).href;
        const extension = artworkPath.split('.').pop().toLocaleLowerCase();
        const artworkType = extension === 'png' ? 'image/png' : 'image/jpeg';

        navigator.mediaSession.metadata = new MediaMetadata({
          title: event.detail.title || 'Без названия',
          artist: event.detail.student || 'Неизвестный ученик',
          album: 'Студия звукорежиссуры и современной электронной музыки',
          artwork: [{ src: artworkUrl, type: artworkType }]
        });
      }

      const isMobile = window.matchMedia('(pointer: coarse)').matches
        || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (!isMobile || !event.detail.file) return;

      const token = ++mobileAnalysisToken;
      mobileTrackAnalysis = null;
      let context;

      try {
        const response = await fetch(event.detail.file);
        if (!response.ok) throw new Error(`Track loading failed: ${response.status}`);

        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        context = new AudioContextClass();
        const buffer = await context.decodeAudioData(await response.arrayBuffer());
        if (token !== mobileAnalysisToken) return;

        const samples = buffer.getChannelData(0);
        const step = .06;
        const windowSize = Math.max(1, Math.floor(buffer.sampleRate * step));
        const energy = new Float32Array(Math.ceil(samples.length / windowSize));

        for (let windowIndex = 0; windowIndex < energy.length; windowIndex += 1) {
          const start = windowIndex * windowSize;
          const end = Math.min(samples.length, start + windowSize);
          let sum = 0;
          let count = 0;

          for (let sampleIndex = start; sampleIndex < end; sampleIndex += 4) {
            const sample = samples[sampleIndex];
            sum += sample * sample;
            count += 1;
          }

          energy[windowIndex] = count ? Math.sqrt(sum / count) : 0;
        }

        const sorted = Array.from(energy).sort((a, b) => a - b);
        const reference = sorted[Math.floor(sorted.length * .92)] || 1;
        for (let index = 0; index < energy.length; index += 1) {
          energy[index] = Math.min(1, energy[index] / reference);
        }

        mobileTrackAnalysis = { energy, step };
      } catch (error) {
        console.warn('Mobile track analysis unavailable:', error);
      } finally {
        context?.close().catch(() => {});
      }
    });

    if ('mediaSession' in navigator) {
      const updatePlayerScene = () => {
        window.player?.updateButton();
        window.player?.updateSceneState();
      };
      const mediaActions = {
        play: () => {
          if (!window.audio?.currentTrack) return;
          window.audio?.audio.play().catch(() => {});
          updatePlayerScene();
        },
        pause: () => {
          window.audio?.pause();
          updatePlayerScene();
        },
        seekbackward: (details) => {
          const audio = window.audio?.audio;
          if (audio) audio.currentTime = Math.max(0, audio.currentTime - (details.seekOffset || 10));
        },
        seekforward: (details) => {
          const audio = window.audio?.audio;
          if (audio) audio.currentTime = Math.min(audio.duration || Infinity, audio.currentTime + (details.seekOffset || 10));
        },
        seekto: (details) => {
          const audio = window.audio?.audio;
          if (!audio || typeof details.seekTime !== 'number') return;
          if (details.fastSeek && typeof audio.fastSeek === 'function') audio.fastSeek(details.seekTime);
          else audio.currentTime = details.seekTime;
        }
      };

      Object.entries(mediaActions).forEach(([action, handler]) => {
        try {
          navigator.mediaSession.setActionHandler(action, handler);
        } catch (error) {
          console.debug(`Media action ${action} is unavailable`, error);
        }
      });
    }

    window.addEventListener('keydown', (event) => {
      const isDesktop = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
      const isInteractiveTarget = event.target.closest?.('input:not([type="range"]), select, textarea, button, [contenteditable="true"]');
      const isPlaying = window.audio && !window.audio.audio.paused;

      if (event.code !== 'Space' || !isDesktop || isInteractiveTarget || !isPlaying) return;

      event.preventDefault();
      if (event.target.matches?.('input[type="range"]')) event.target.blur();
      window.audio.pause();
      window.player?.updateButton();
      window.player?.updateSceneState();
    });
  </script>
